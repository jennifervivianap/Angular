<article class="card" [class.agotado]="producto().stock === 0" [class.destacado]="destacado()">
    <div class="emoji">{{producto().emoji}}</div>
    <h3>{{producto().nombre}}</h3>
    <span class="categoria">{{producto().categoria}}</span>
    <p class="precio">$ {{producto().precio}}</p>
    <p class="stock">En stock: {{producto().stock}}</p>
    <div>
        <button class="boton" (click)="onAgregar()" [disabled]="producto().stock === 0">Agregar</button>
    </div>
</article>
